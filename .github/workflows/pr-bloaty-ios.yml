name: pr-bloaty-ios

on:
  workflow_run:
    workflows: [ios-ci]
    types:
      - completed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: ${{ github.event.workflow_run.event == 'pull_request' }}

env:
  download_url: https://maplibre-native.s3.eu-central-1.amazonaws.com

permissions:
  pull-requests: write
  id-token: write      # This is required for requesting the AWS JWT

jobs:
  pre_job:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-26.04
    outputs:
      pr-number: ${{ steps.get-pr-number.outputs.pr-number }}
      artifacts: ${{ steps.artifacts.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - uses: ./.github/actions/get-pr-number
        id: get-pr-number

      # results jobs that were skipped, cancelled or failed uploaded nothing
      - name: List the results ios-ci uploaded
        id: artifacts
        run: echo "names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '[.artifacts[].name]')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}

  pr-bloaty-ios:
    needs: pre_job
    if: needs.pre_job.outputs.pr-number && contains(fromJSON(needs.pre_job.outputs.artifacts), 'ios-bloaty-results')
    runs-on: ubuntu-26.04
    env:
      PR_NUMBER: ${{ needs.pre_job.outputs.pr-number }}
    environment:
      name: workflow-run
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - uses: ./.github/actions/download-workflow-run-artifact
        with:
          artifact-name: ios-bloaty-results
          files: "bloaty_diff.txt"

      - name: Configure AWS Credentials
        if: vars.OIDC_AWS_ROLE_TO_ASSUME
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.OIDC_AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ github.run_id }}

      - name: Prepare Bloaty message
        run: |
          report_path="bloaty-results-ios/pr-${PR_NUMBER}-compared-to-main.txt"
          aws s3 cp bloaty_diff.txt s3://maplibre-native/"$report_path"
          {
            echo "# Bloaty Results (iOS) 🐋"
            echo 'Compared to main'
            echo '```'
            tr -d '`' < bloaty_diff.txt | awk 'NR <= 2; END { print }'
            echo '```'
            echo "Full report: $download_url/$report_path"
            echo "---"
          } >> message.md

      - name: Leave a comment with Bloaty results
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          number: ${{ env.PR_NUMBER }}
          header: bloaty-ios
          path: message.md
