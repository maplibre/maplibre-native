name: plugins-ci

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/**'
      - 'include/mln/plugin/**'
      - 'src/mln/**/*plugin*'
      - 'test/plugin/**'
      - 'render-test/**'
      - 'metrics/**'
      - '.github/workflows/plugins-ci.yml'

  pull_request:
    paths:
      - 'plugins/**'
      - 'include/mln/plugin/**'
      - 'src/mln/**/*plugin*'
      - 'test/plugin/**'
      - 'render-test/**'
      - 'metrics/**'
      - '.github/workflows/plugins-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  generated-files:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      # The platform wrappers in plugins/android and plugins/ios are generated from plugins/plugins/*/plugin.json.
      - name: Check the generated plugin wrappers
        run: node plugins/tools/generate.ts --check

      # A plugin with scripts/generate-shaders.ts prints the shader header in shared/cpp.
      - name: Check the generated shader headers
        run: |
          for script in plugins/plugins/*/scripts/generate-shaders.ts; do
            plugin=$(dirname "$(dirname "$script")")
            node "$script" | diff - "$plugin"/shared/cpp/*_shader_sources.hpp
          done

  # The render tests of every plugin, on every renderer it supports, and the plugin API tests.
  tests:
    name: Plugin tests (${{ matrix.preset }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-opengl
            runner: ubuntu-26.04
          - preset: linux-vulkan
            runner: ubuntu-26.04
          - preset: macos-metal
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: .github/scripts/install-linux-deps

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew install cmake ninja pkg-config glfw libuv icu4c jpeg-turbo webp libpng

      # The presets compile through ccache.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: plugins-${{ matrix.preset }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DMLN_WITH_PLUGINS=ON

      - name: Build
        run: cmake --build build-${{ matrix.preset }} --target mln-plugin-tests

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build-${{ matrix.preset }}/plugins --output-on-failure

      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: ctest --test-dir build-${{ matrix.preset }}/plugins --output-on-failure
