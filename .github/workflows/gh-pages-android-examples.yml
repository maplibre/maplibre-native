name: gh-pages-android-examples

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'platform/android/**'

jobs:
  gh-pages-android-examples:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/android
        shell: bash
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate documentation
        run: make mkdocs-build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: platform/android/site
          target-folder: android/examples/
