# Reports the Bloaty (size test) and Google Benchmark results from linux-ci on PR
name: pr-linux-tests

on:
  workflow_run:
    workflows: [linux-ci]
    types:
      - completed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: ${{ github.event.workflow_run.event == 'pull_request' }}

env:
  download_url: https://maplibre-native.s3.eu-central-1.amazonaws.com
  legacy_maplibre_sha: d38709084a9865fe0bb8300aec70ebf8243b3d43  # also in linux-ci.yml

permissions:
  pull-requests: write
  id-token: write      # This is required for requesting the AWS JWT

jobs:
  pre_job:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-26.04
    outputs:
      # empty when the results job was skipped or cancelled, or there is no PR to report to
      pr-number: ${{ steps.parent_workflow.outputs.was_skipped_or_cancelled == 'false' && steps.get-pr-number.outputs.pr-number || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github
            .nvmrc
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - run: npm install

      - name: Get parent workflow result
        id: parent_workflow
        run: node .github/scripts/check-job-skipped.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_RUN_ID: ${{ github.event.workflow_run.id }}
          JOB_NAME: linux-bloaty

      - uses: ./.github/actions/get-pr-number
        id: get-pr-number

  pr-bloaty:
    needs: pre_job
    if: needs.pre_job.outputs.pr-number
    runs-on: ubuntu-26.04
    env:
      PR_NUMBER: ${{ needs.pre_job.outputs.pr-number }}
    environment:
      name: workflow-run
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - uses: ./.github/actions/download-workflow-run-artifact
        with:
          artifact-name: bloaty-results
          files: "tlus_diff_main.txt,tlus_diff_legacy.txt"
          optional: 'true'  # linux-bloaty skips the legacy comparison when its binary can't be downloaded

      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/main' && vars.OIDC_AWS_ROLE_TO_ASSUME
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.OIDC_AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ github.run_id }}

      - name: Prepare Bloaty message (main)
        run: |
          report_path="bloaty-results/pr-${PR_NUMBER}-compared-to-main.txt"
          aws s3 cp tlus_diff_main.txt s3://maplibre-native/"$report_path"
          {
            echo "# Bloaty Results 🐋"
            echo 'Compared to main'
            echo '```'
            tr -d '`' < tlus_diff_main.txt | awk 'NR <= 2; END { print }'
            echo '```'
            echo "Full report: $download_url/$report_path"
            echo "---"
          } >> message.md

      - name: Prepare Bloaty message (legacy)
        if: hashFiles('tlus_diff_legacy.txt') != ''
        run: |
          report_path="bloaty-results/pr-${PR_NUMBER}-compared-to-legacy.txt"
          aws s3 cp tlus_diff_legacy.txt s3://maplibre-native/"$report_path"
          {
            echo "Compared to $legacy_maplibre_sha (legacy)"
            echo '```'
            tr -d '`' < tlus_diff_legacy.txt | awk 'NR <= 2; END { print }'
            echo '```'
            echo "Full report: $download_url/$report_path"
          } >> message.md

      - name: Leave a comment with Bloaty results
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          number: ${{ env.PR_NUMBER }}
          header: bloaty
          path: message.md

  pr-benchmark:
    needs: pre_job
    if: needs.pre_job.outputs.pr-number
    runs-on: ubuntu-26.04
    env:
      PR_NUMBER: ${{ needs.pre_job.outputs.pr-number }}
    environment:
      name: workflow-run
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - uses: ./.github/actions/download-workflow-run-artifact
        with:
          artifact-name: benchmark-results
          files: "benchmark_out.txt"

      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/main' && vars.OIDC_AWS_ROLE_TO_ASSUME
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.OIDC_AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ github.run_id }}

      - name: Prepare Benchmark message
        run: |
          sed -n '/Comparing/,$p' benchmark_out.txt | tail -n +2 > benchmark_diff.txt
          report_path="benchmark-results/pr-${PR_NUMBER}-compared-to-main.txt"
          aws s3 cp benchmark_diff.txt s3://maplibre-native/"$report_path"
          {
            echo "Benchmark Results ⚡"
            echo '```'
            tr -d '`' < benchmark_diff.txt | awk 'NR <= 2; END { print }'
            echo '```'
            echo "Full report: $download_url/$report_path"
          } >> message.md

      - name: Leave a comment with Benchmark results
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          number: ${{ env.PR_NUMBER }}
          header: benchmark
          path: message.md
