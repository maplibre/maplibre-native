name: Start iOS plugin prerelease

on:
  push:
    branches:
      - codex/ios-plugin-distribution
    paths:
      - .github/workflows/start-ios-plugin-prerelease.yml

permissions:
  actions: write
  contents: read

jobs:
  start-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Run ios-release from this branch
        run: |
          gh workflow run ios-release.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --field release=full \
            --field distribution_ref="$GITHUB_REF_NAME"
