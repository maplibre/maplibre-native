name: android-release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-create-release:
    runs-on: ubuntu-26.04
    outputs:
      version_tag: ${{ steps.prepare_release.outputs.version_tag }}
    defaults:
      run:
        working-directory: platform/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate and set version
        working-directory: .
        run: .github/scripts/validate-version.sh platform/android/VERSION

      - name: npm install
        run: npm install --ignore-scripts

      # create github release
      - name: Prepare release
        id: prepare_release
        run: |
          RELEASE_NOTES_PATH="${PWD}/release_notes.txt"
          node scripts/release-notes.mjs ${{ env.version }} > "${RELEASE_NOTES_PATH}"
          echo release_notes="${RELEASE_NOTES_PATH}" >> "$GITHUB_OUTPUT"
          echo version_tag=android-v${{ env.version }} >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Check if version is pre-release
        id: check_version
        run: |
          version="${{ env.version }}"
          if [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Valid semver: $version"
            echo "prerelease=false" >> "$GITHUB_ENV"
          else
            echo "Invalid semver: $version"
            echo "prerelease=true" >> "$GITHUB_ENV"
          fi

      - name: Create tag if it does not exist
        working-directory: .
        run: .github/scripts/ensure-tag.sh android-v${{ env.version }} ${{ github.sha }}

      - name: Create release (draft)
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.prepare_release.outputs.version_tag }}
          name: ${{ steps.prepare_release.outputs.version_tag }}
          body_path: ${{ steps.prepare_release.outputs.release_notes }}
          draft: true
          prerelease: ${{ env.prerelease }}

  android-build-and-upload-release:
    needs: android-create-release
    runs-on: MapLibre_Native_Ubuntu_24_04_x84_16_core
    defaults:
      run:
        working-directory: platform/android
    env:
      JOBS: 8
      IS_LOCAL_DEVELOPMENT: false
      FLAVOR: ${{ matrix.FLAVOR }}
      BUILDTYPE: ${{ matrix.BUILDTYPE }}
      VERSION_TAG: ${{ needs.android-create-release.outputs.version_tag }}
    strategy:
      matrix:
        # Product flavors of MapLibreAndroid. maplibre.gradle-publish.gradle.kts defines their Maven artifact IDs.
        FLAVOR:
          - vulkan
          - opengl
          - multiBackend
          - vulkanWithPluginApi
          - openglWithPluginApi
          - multiBackendWithPluginApi
        BUILDTYPE:
          - Release
          - Debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: npm install
        run: npm install --ignore-scripts

      - name: Android nitpick
        run: make run-android-nitpick

      - name: Build package
        run: RENDERER="$FLAVOR" make apackage

      - name: Prepare release assets (include tag in filenames)
        run: |
          buildtype="${BUILDTYPE,,}"
          mkdir -p build/release-assets
          mv "MapLibreAndroid/build/outputs/aar/MapLibreAndroid-$FLAVOR-$buildtype.aar" \
             "build/release-assets/MapLibreAndroid-$FLAVOR-$buildtype-$VERSION_TAG.aar"
          mv "build/debug-symbols-$FLAVOR-$buildtype.tar.gz" \
             "build/release-assets/debug-symbols-maplibre-android-$FLAVOR-$buildtype-$VERSION_TAG.tar.gz"

      - name: Upload release assets (${{ matrix.FLAVOR }}, ${{ matrix.BUILDTYPE }})
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.VERSION_TAG }}
          fail_on_unmatched_files: true
          draft: true
          files: platform/android/build/release-assets/*

      - name: Sign the Maven publications
        run: ./gradlew ":MapLibreAndroid:publish${FLAVOR^}${BUILDTYPE}Publications" -PpublicationRepositoryUrl="file://$PWD/build/maven-repository"
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      # Maven Central validates the deployment, but only android-publish-maven-central publishes it
      - name: Upload the Maven publications to Maven Central
        run: |
          mkdir -p build/maven-central-deployments
          "$GITHUB_WORKSPACE/.github/scripts/maven-central.sh" upload build/maven-repository \
            "$VERSION_TAG $FLAVOR$BUILDTYPE" "build/maven-central-deployments/$FLAVOR$BUILDTYPE"
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Save the Maven Central deployment ID
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-central-deployment-${{ matrix.FLAVOR }}-${{ matrix.BUILDTYPE }}
          path: platform/android/build/maven-central-deployments
          if-no-files-found: error
          overwrite: true

  android-publish-maven-central:
    needs: android-build-and-upload-release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the Maven Central deployment IDs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: maven-central-deployment-*
          path: maven-central-deployments
          merge-multiple: true

      - name: Publish to Maven Central
        run: cat maven-central-deployments/* | xargs .github/scripts/maven-central.sh publish
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  finilize-release:
    runs-on: ubuntu-26.04
    needs:
      - android-create-release
      - android-publish-maven-central
    steps:
      - name: Publish release (remove draft)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.android-create-release.outputs.version_tag }}
          name: ${{ needs.android-create-release.outputs.version_tag }}
          draft: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - run: npm install
        working-directory: .

      - name: Write release notifications
        if: github.repository_owner == 'maplibre'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/notify-release-on-prs.ts --tag ${{ needs.android-create-release.outputs.version_tag }}
        working-directory: .
