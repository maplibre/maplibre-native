name: android-release

on:
  workflow_dispatch:
    inputs:
      release:
        type: choice
        default: full
        options:
          - full
          - pre
        description: Full release (uses platform/android/VERSION) or pre-release
      pre_release_version:
        type: string
        default: ''
        description: 'Pre-release version (X.Y.Z-pre*, defaults to VERSION-pre<commit SHA>)'

permissions:
  contents: write

jobs:
  android-create-release:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.prepare_release.outputs.version }}
      version_tag: ${{ steps.prepare_release.outputs.version_tag }}
      prerelease: ${{ steps.check_version.outputs.prerelease }}
    defaults:
      run:
        working-directory: platform/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set pre-release version
        if: inputs.release == 'pre'
        env:
          PRE_RELEASE_VERSION: ${{ inputs.pre_release_version }}
        run: |
          version="${PRE_RELEASE_VERSION:-$(cat VERSION)-pre${GITHUB_SHA}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-pre[0-9A-Za-z-]*(\.[0-9A-Za-z-]+)*$ ]]; then
            echo "::error::Pre-release version must have the format X.Y.Z-pre*"
            exit 1
          fi
          printf '%s\n' "$version" > VERSION

      - name: Validate and set version
        working-directory: .
        run: .github/scripts/validate-version.sh platform/android/VERSION

      - name: npm install
        run: npm install --ignore-scripts

      # create github release
      - name: Prepare release
        id: prepare_release
        run: |
          RELEASE_NOTES_PATH="${PWD}/release_notes.txt"
          node scripts/release-notes.mjs "$version" > "${RELEASE_NOTES_PATH}"
          if [[ ! -s "$RELEASE_NOTES_PATH" && "$version" == *-pre* ]]; then
            printf 'Pre-release build from commit %s.\n' "$GITHUB_SHA" > "$RELEASE_NOTES_PATH"
          fi
          {
            echo "release_notes=$RELEASE_NOTES_PATH"
            echo "version=$version"
            echo "version_tag=android-v$version"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Check if version is pre-release
        id: check_version
        run: |
          if [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version: $version"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "Pre-release version: $version"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag if it does not exist
        working-directory: .
        run: .github/scripts/ensure-tag.sh "android-v$version" "$GITHUB_SHA"

      - name: Create release (draft)
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.prepare_release.outputs.version_tag }}
          name: ${{ steps.prepare_release.outputs.version_tag }}
          body_path: ${{ steps.prepare_release.outputs.release_notes }}
          draft: true
          prerelease: ${{ steps.check_version.outputs.prerelease }}

  android-build-and-upload-release:
    needs: android-create-release
    runs-on: MapLibre_Native_Ubuntu_24_04_x84_16_core
    defaults:
      run:
        working-directory: platform/android
    env:
      JOBS: 8
      IS_LOCAL_DEVELOPMENT: false
    strategy:
      matrix:
        RENDERER:
          - vulkan
          - opengl
          - multiBackend
        BUILDTYPE:
          - Release
          - Debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set build and Maven publication version
        env:
          RELEASE_VERSION: ${{ needs.android-create-release.outputs.version }}
        run: printf '%s\n' "$RELEASE_VERSION" > VERSION

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: npm install
        run: npm install --ignore-scripts

      - name: Android nitpick
        run: make run-android-nitpick

      - name: Build package
        run: RENDERER=${{ matrix.RENDERER }} BUILDTYPE=${{ matrix.BUILDTYPE }} make apackage

      - name: Save buildtype to GITHUB_ENV
        run: |
          buildtype=${{ matrix.BUILDTYPE }}
          # lowercase
          echo buildtype=${buildtype,,} > "$GITHUB_ENV"

      - name: Prepare release asset filenames (include tag)
        run: |
          version_tag='${{ needs.android-create-release.outputs.version_tag }}'
          # AAR
          aar_dir='MapLibreAndroid/build/outputs/aar'
          mv "$aar_dir/MapLibreAndroid-${{ matrix.RENDERER }}-${{ env.buildtype }}.aar" \
             "$aar_dir/MapLibreAndroid-${{ matrix.RENDERER }}-${{ env.buildtype }}-$version_tag.aar"
          # Debug symbols
          mv "build/debug-symbols-${{ matrix.RENDERER }}-${{ env.buildtype }}.tar.gz" \
             "build/debug-symbols-maplibre-android-${{ matrix.RENDERER }}-${{ env.buildtype }}-$version_tag.tar.gz"

      - name: Upload release assets (${{ matrix.RENDERER }}, ${{ matrix.BUILDTYPE }})
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.android-create-release.outputs.version_tag }}
          fail_on_unmatched_files: true
          draft: true
          prerelease: ${{ needs.android-create-release.outputs.prerelease }}
          files: |
            platform/android/MapLibreAndroid/build/outputs/aar/MapLibreAndroid-${{ matrix.RENDERER }}-${{ env.buildtype }}-${{ needs.android-create-release.outputs.version_tag }}.aar
            platform/android/build/debug-symbols-maplibre-android-${{ matrix.RENDERER }}-${{ env.buildtype }}-${{ needs.android-create-release.outputs.version_tag }}.tar.gz

      - name: Publish to MavenCentral
        run: |
          renderer=${{ matrix.RENDERER }}
          if [ "$renderer" = "opengl" ]; then
            ./gradlew :MapLibreAndroid:publishOpengl${{ env.buildtype }}PublicationToMavenCentralRepository
            ./gradlew :MapLibreAndroid:publishDefault${{ env.buildtype }}PublicationToMavenCentralRepository
          elif [ "$renderer" = "vulkan" ]; then
            ./gradlew :MapLibreAndroid:publishVulkan${{ env.buildtype }}PublicationToMavenCentralRepository
          elif [ "$renderer" = "multiBackend" ]; then
            ./gradlew :MapLibreAndroid:publishMultibackend${{ env.buildtype }}PublicationToMavenCentralRepository
          else
            echo "::error ::Unknown renderer '$renderer'"; exit 1
          fi
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

  finilize-release:
    runs-on: ubuntu-latest
    needs:
      - android-create-release
      - android-build-and-upload-release
    steps:
      - name: Publish release (remove draft)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.android-create-release.outputs.version_tag }}
          name: ${{ needs.android-create-release.outputs.version_tag }}
          draft: false
          prerelease: ${{ needs.android-create-release.outputs.prerelease }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - run: npm install
        working-directory: .

      - name: Write release notifications
        if: github.repository_owner == 'maplibre' && needs.android-create-release.outputs.prerelease != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/notify-release-on-prs.ts --tag ${{ needs.android-create-release.outputs.version_tag }}
        working-directory: .
