name: ios-device-test

on:
  workflow_run:
    workflows: [ios-ci]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  id-token: write         # needed for AWS

jobs:
  ios-device-test:
    strategy:
      matrix:
        test: [
          {artifactName: ios-render-test, xcTestFile: RenderTest.xctest.zip, ipaFile: RenderTestApp.ipa, name: "iOS Render Tests", testType: XCTEST, testPackageType: XCTEST_TEST_PACKAGE},
          {artifactName: ios-cpp-unit-tests, xcTestFile: CppUnitTests.xctest.zip, ipaFile: CppUnitTestsApp.ipa, name: "iOS C++ Unit Tests", testType: XCTEST, testPackageType: XCTEST_TEST_PACKAGE},
          {artifactName: ios-benchmark, xcTestFile: BenchmarkUITests-Runner.ipa, ipaFile: BenchmarkApp.ipa, name: "iOS Benchmark", testType: XCTEST_UI, testPackageType: XCTEST_UI_TEST_PACKAGE, benchmark: true},
        ]
      fail-fast: false
    runs-on: ubuntu-26.04
    if: github.repository_owner == 'maplibre' && github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate_token
        with:
          app-id: ${{ secrets.MAPLIBRE_NATIVE_BOT_APP_ID }}
          private-key: ${{ secrets.MAPLIBRE_NATIVE_BOT_PRIVATE_KEY }}

      - uses: ./.github/actions/get-pr-number
        if: matrix.test.benchmark
        id: get-pr-number

      - name: Check if comment on PR contains '!benchmark ios'
        if: matrix.test.benchmark && steps.get-pr-number.outputs.pr-number
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: benchmark_comment
        with:
          issue-number: ${{ steps.get-pr-number.outputs.pr-number }}
          body-regex: '^!benchmark.*ios.*$'

      - name: Should we run this device test?
        # run benchmark when comment with '!benchmark ios' exists in PR
        if: ${{ !matrix.test.benchmark || steps.benchmark_comment.outputs.comment-id }}
        run:
          echo "run_device_test=true" >> "$GITHUB_ENV"

      - uses: LouisBrunner/checks-action@937cbbcde3259005b50746dc91cde29098aac2ff # v3.1.0
        if: env.run_device_test == 'true'
        id: create_check
        with:
          token: ${{ steps.generate_token.outputs.token }}
          details_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          status: in_progress
          name: ${{ matrix.test.name }}
          sha: ${{ github.event.workflow_run.head_sha }}

      - uses: ./.github/actions/download-workflow-run-artifact
        if: env.run_device_test == 'true'
        with:
          artifact-name: ${{ matrix.test.artifactName }}

      - name: Check if test files exist (otherwise the parent workflow was skipped)
        if: env.run_device_test == 'true'
        id: check_files
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          files: "${{ matrix.test.xcTestFile }}, ${{ matrix.test.ipaFile }}"
          # ios-ci only builds the benchmark if the comment existed when it ran
          fail: ${{ matrix.test.benchmark == true }}

      - name: Configure AWS Credentials
        if: env.run_device_test == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.OIDC_AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ github.run_id }}
          role-duration-seconds: 14400

      - name: Run ${{ matrix.test.name }} on AWS Device Farm
        if: steps.check_files.outputs.files_exists == 'true'
        run: |
          export name="${{ matrix.test.name }}"
          export appType=IOS_APP
          export appFile="${{ matrix.test.ipaFile }}"
          export testFile="${{ matrix.test.xcTestFile }}"
          export testPackageType="${{ matrix.test.testPackageType }}"
          export testType="${{ matrix.test.testType }}"
          export AWS_DEVICE_FARM_PROJECT_ARN="${{ vars.AWS_DEVICE_FARM_PROJECT_ARN }}"
          export AWS_DEVICE_FARM_DEVICE_POOL_ARN="${{ vars.AWS_DEVICE_FARM_IPHONE_DEVICE_POOL_ARN }}"
          export wait_for_completion=true

          set +e

          run_arn="$(./scripts/aws-device-farm/aws-device-farm-run.sh)"
          exit_status=$?
          echo "run_arn=$run_arn" >> "$GITHUB_ENV"

          # make sure workflow fails
          if [ $exit_status -ne 0 ]; then
            exit $exit_status
          fi

      # the benchmark results are in the device syslog
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: always() && matrix.test.benchmark && env.run_arn
        with:
          node-version-file: '.nvmrc'

      - name: Store Test Artifacts
        if: always() && matrix.test.benchmark && env.run_arn
        run: |
          npm install
          results_dir="$(mktemp -d)"
          node scripts/aws-device-farm/store-test-artifacts.mjs --runArn "${{ env.run_arn }}" --outputDir "$results_dir"
          # unzip and delete .zip files so we don't have nested .zip
          find "$results_dir" -type f -name '*.zip' -exec sh -c 'unzip -o -d "$(dirname "$1")" "$1" && rm "$1"' _ {} \;
          zip -r test_artifacts.zip "$results_dir"

      - name: Upload Test Artifacts
        if: always() && matrix.test.benchmark && env.run_arn
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "Test Artifacts ${{ matrix.test.name }}"
          path: test_artifacts.zip

      - name: Generate another token (previous one could have expired)
        if: always() && steps.create_check.outputs.check_id
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate_token_2
        with:
          app-id: ${{ secrets.MAPLIBRE_NATIVE_BOT_APP_ID }}
          private-key: ${{ secrets.MAPLIBRE_NATIVE_BOT_PRIVATE_KEY }}

      - uses: LouisBrunner/checks-action@937cbbcde3259005b50746dc91cde29098aac2ff # v3.1.0
        if: always() && steps.create_check.outputs.check_id
        with:
          token: ${{ steps.generate_token_2.outputs.token }}
          check_id: ${{ steps.create_check.outputs.check_id }}
          conclusion: ${{ job.status }}
          sha: ${{ github.event.workflow_run.sha }}
