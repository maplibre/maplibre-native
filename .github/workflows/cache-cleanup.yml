name: cleanup-branch-caches
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-26.04
    permissions:
      # `actions:write` permission is required to delete caches
      #   See also: https://docs.github.com/en/rest/actions/cache?apiVersion=2022-11-28#delete-a-github-actions-cache-for-a-repository-using-a-cache-id
      actions: write
      pull-requests: read
    steps:
      - name: Delete caches of closed PRs
        run: |
          refs=$(gh cache list --limit 1000 --json ref \
            --jq '[.[].ref | select(test("^refs/pull/[0-9]+/merge$"))] | unique | .[]')

          for ref in $refs; do
            pr=${ref#refs/pull/}
            pr=${pr%/merge}
            state=$(gh pr view "$pr" --json state --jq .state)
            if [ "$state" != OPEN ]; then
              echo "Deleting caches of #$pr ($state)"
              gh cache delete --all --ref "$ref" --succeed-on-no-caches
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
