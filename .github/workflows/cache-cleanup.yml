name: cleanup-branch-caches
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-26.04
    permissions:
      # `actions:write` permission is required to delete caches
      #   See also: https://docs.github.com/en/rest/actions/cache?apiVersion=2022-11-28#delete-a-github-actions-cache-for-a-repository-using-a-cache-id
      actions: write
      pull-requests: read
    steps:
      - name: Delete caches of closed PRs
        run: |
          prs=$(gh cache list --limit 1000 --json ref \
            --jq '[.[].ref | capture("^refs/pull/(?<n>[0-9]+)/merge$").n] | unique | .[]')

          open=$(gh pr list --state open --limit 1000 --json number --jq '.[].number')

          for pr in $(comm -23 <(sort <<< "$prs") <(sort <<< "$open")); do
            echo "Deleting caches of #$pr"
            gh cache delete --all --ref "refs/pull/$pr/merge" --succeed-on-no-caches
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
