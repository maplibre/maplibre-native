name: gh-pages-docc

permissions:
  id-token: write
  pages: write
  contents: write

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - ios-ci
    types:
      - completed

jobs:
  gh-pages-docc-build:
    name: Build DocC Docs
    runs-on: macos-latest
    if: ${{ github.ref_name == 'main' }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.OIDC_AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ github.run_id }}

      - name: Build DocC documentation
        working-directory: .
        run: |
          HOSTING_BASE_PATH="maplibre-native/ios/latest" platform/ios/scripts/docc.sh

      # workaround since colons in filenames are not allowed in artifacts
      # https://github.com/actions/upload-artifact/issues/333
      - name: Create ZIP archive
        run: |
          cd build
          zip -r docs.zip docs/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docc-docs
          path: build/docs.zip

  gh-pages-docc-deploy:
    needs: gh-pages-docc-build
    name: Deploy DocC Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download DocC docs artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docc-docs
          path: build

      - name: Unzip documentation
        run: |
          cd build
          unzip docs.zip
          rm docs.zip

      - name: Deploy DocC documentation (main) 🚀
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: build/docs
          target-folder: ios/latest/
