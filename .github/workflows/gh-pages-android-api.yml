name: gh-pages-android-api

on:
  workflow_dispatch:
  workflow_run:
    workflows: [android-release]
    types:
      - completed

jobs:
  gh-pages-android-api:
    defaults:
      run:
        working-directory: platform/android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Generate documentation
        run: ./gradlew dokkaGenerate

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: platform/android/MapLibreAndroid/build/dokka/html
          target-folder: android/api/
