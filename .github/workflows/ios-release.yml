name: ios-release

on:
  workflow_dispatch:
    inputs:
      release:
        type: choice
        default: full
        options:
          - full
          - pre
        description: Whether to make a release, choose full release (uses platform/ios/VERSION) or pre-release
      pre_release_version:
        type: string
        default: ''
        description: Version (only for pre-releases)
      distribution_ref:
        type: string
        default: main
        description: Branch of maplibre-gl-native-distribution containing the release workflow

jobs:
  ios-build-dynamic:
    name: iOS dynamic (${{ matrix.variant.name }})
    runs-on: macos-26
    strategy:
      matrix:
        variant:
          - name: MapLibre
            target: MapLibre.dynamic
            plugins: false
            artifact: xcframework
          - name: MapLibreWithPlugins
            target: MapLibre.dynamic.plugins
            plugins: true
            artifact: xcframework-plugins
    env:
      FRAMEWORK_NAME: ${{ matrix.variant.name }}
      FRAMEWORK_TARGET: ${{ matrix.variant.target }}
      WITH_PLUGINS: ${{ matrix.variant.plugins }}
    defaults:
      run:
        working-directory: platform/ios
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build XCFramework (Dynamic)
        run: |
          bazel build --compilation_mode=opt --features=dead_strip,thin_lto --objc_enable_binary_stripping \
            --apple_generate_dsym --output_groups=+dsyms --//:renderer=metal --//:plugins="$WITH_PLUGINS" \
            "//platform/ios:$FRAMEWORK_TARGET" --embed_label=maplibre_ios_"$(cat VERSION)"
          echo xcframework="$(bazel info execution_root)"/"$(bazel cquery --output=files --compilation_mode=opt --//:renderer=metal --//:plugins="$WITH_PLUGINS" "//platform/ios:$FRAMEWORK_TARGET")" >> "$GITHUB_ENV"

      - name: Verify plugin API in XCFramework
        if: matrix.variant.plugins
        run: |
          unzip -q "$xcframework" -d "$RUNNER_TEMP/plugin-xcframework"
          python3 scripts/verify-plugin-xcframework.py "$RUNNER_TEMP/plugin-xcframework/MapLibreWithPlugins.xcframework"

      - name: Create .zip with debug symbols
        working-directory: ./bazel-bin/platform/ios/${{ matrix.variant.target }}_dsyms
        run: |
          zip "${FRAMEWORK_NAME}_ios_device.framework.dSYM.zip" \
            "${FRAMEWORK_NAME}_ios_device.framework.dSYM/Contents/Resources/DWARF/${FRAMEWORK_NAME}_ios_device" \
            "${FRAMEWORK_NAME}_ios_device.framework.dSYM/Contents/Info.plist"
          echo "debug_symbols_ios=$(realpath "${FRAMEWORK_NAME}_ios_device.framework.dSYM.zip")" >> "$GITHUB_ENV"

      - name: Copy debug symbols to root
        working-directory: .
        run: cp "$debug_symbols_ios" .

      - name: Add license to XCFramework zip
        run: |
          cp "$xcframework" "$FRAMEWORK_TARGET.xcframework.zip"
          chmod +w "$FRAMEWORK_TARGET.xcframework.zip"
          zip "$FRAMEWORK_TARGET.xcframework.zip" LICENSE.md  # add license to zip
        working-directory: .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.variant.artifact }}
          path: |
            ${{ matrix.variant.target }}.xcframework.zip
            ${{ matrix.variant.name }}_ios_device.framework.dSYM.zip

  ios-build-static:
    runs-on: macos-15
    defaults:
      run:
        working-directory: platform/ios
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build XCFramework (Static)
        # for now, just build it TODO: make a static framework release
        run: |
          bazel build //platform/ios:MapLibre.static --//:renderer=metal --compilation_mode="opt" --copt -g --copt="-Oz" --strip never --output_groups=+dsyms --apple_generate_dsym
          echo xcframework_static="$(bazel info execution_root)"/"$(bazel cquery --output=files --compilation_mode=opt --//:renderer=metal //platform/ios:MapLibre.static)" >> "$GITHUB_ENV"

      - name: Add license to XCFramework zip
        run: |
          cp ${{ env.xcframework_static }} MapLibre.static.xcframework.zip
          chmod +w MapLibre.static.xcframework.zip
          zip MapLibre.static.xcframework.zip LICENSE.md  # add license to zip
        working-directory: .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcframework-static
          path: |
            MapLibre.static.xcframework.zip

  ios-release:
    permissions:
      id-token: write         # needed for AWS
      contents: write         # allow making a release
      actions: write          # for triggering ios-release-cocoapods.yml
      issues: write           # for notify-release-on-prs.ts
    runs-on: ubuntu-latest
    needs:
      - ios-build-dynamic
      - ios-build-static
    defaults:
      run:
        working-directory: platform/ios
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Get version (release)
        if: github.event.inputs.release == 'full'
        run: |
          echo version="$(head VERSION)" >> "$GITHUB_ENV"
          echo changelog_version_heading="## $(head VERSION)" >> "$GITHUB_ENV"

      - name: Get version (pre-release)
        if: github.event.inputs.release == 'pre'
        run: |
          version="${{ github.event.inputs.pre_release_version }}"
          if [[ -z "$version" ]]; then
            version="$(head VERSION)"
            version="${version%%-pre*}"-pre${{ github.sha }}
          fi
          if [[ "$version" != *"pre"* ]]; then
            echo "::error::Pre-release version must include 'pre' (Current version: $version)"
            exit 1
          fi
          echo version="$version" >> "$GITHUB_ENV"
          echo changelog_version_heading="## main" >> "$GITHUB_ENV"

      - name: Create tag if it does not exist
        working-directory: .
        run: .github/scripts/ensure-tag.sh ios-v${{ env.version }} ${{ github.sha }}

      - name: Extract changelog for version
        run: |
          awk '/^##/ { p = 0 }; p == 1 { print }; $0 == "${{ env.changelog_version_heading }}" { p = 1 };' CHANGELOG.md > changelog_for_version.md
          cat changelog_for_version.md

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.OIDC_AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ github.run_id }}

      - name: Upload changelog to S3
        run: aws s3 cp changelog_for_version.md s3://maplibre-native/changelogs/ios-${{ env.version }}.md

      - name: Release (GitHub) - Create Draft
        id: github_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ios-v${{ env.version }}
          files: |
            xcframework/MapLibre.dynamic.xcframework.zip
            xcframework/MapLibre_ios_device.framework.dSYM.zip
            xcframework-plugins/MapLibre.dynamic.plugins.xcframework.zip
            xcframework-plugins/MapLibreWithPlugins_ios_device.framework.dSYM.zip
            xcframework-static/MapLibre.static.xcframework.zip
          tag_name: ios-v${{ env.version }}
          prerelease: ${{ github.event.inputs.release == 'pre' || contains(env.version, '-pre') }}
          body_path: platform/ios/changelog_for_version.md
          fail_on_unmatched_files: true
          draft: true

      # needed to trigger workflow for Swift Package Index release
      - name: Generate token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate_token
        with:
          app-id: ${{ secrets.MAPLIBRE_NATIVE_BOT_APP_ID }}
          private-key: ${{ secrets.MAPLIBRE_NATIVE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - run: npm install
        working-directory: .

      - name: Release (CocoaPods)
        shell: bash -leo pipefail {0}  # so pod is found
        run: gh workflow run ios-release-cocoapods.yml --field version=${{ env.version }}
        env:
         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release (remove draft)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ios-v${{ env.version }}
          name: ios-v${{ env.version }}
          draft: false

      - name: Release (Swift Package Index)
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          DISTRIBUTION_REF: ${{ inputs.distribution_ref }}
          VERSION: ${{ env.version }}
        run: |
          gh workflow run release.yml --repo maplibre/maplibre-gl-native-distribution \
            --ref "$DISTRIBUTION_REF" \
            --field version="$VERSION" \
            --field changelog_url="https://maplibre-native.s3.eu-central-1.amazonaws.com/changelogs/ios-$VERSION.md" \
            --field download_url="https://github.com/maplibre/maplibre-native/releases/download/ios-v$VERSION/MapLibre.dynamic.xcframework.zip" \
            --field plugins_download_url="https://github.com/maplibre/maplibre-native/releases/download/ios-v$VERSION/MapLibre.dynamic.plugins.xcframework.zip"

      - name: Write release notifications
        if: github.repository_owner == 'maplibre'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/notify-release-on-prs.ts --tag ios-v${{ env.version }}
        working-directory: .
