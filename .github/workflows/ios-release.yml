name: ios-release

on:
  workflow_dispatch:
    inputs:
      release:
        type: choice
        default: full
        options:
          - full
          - pre
        description: Whether to make a release, choose full release (uses platform/ios/VERSION) or pre-release
      pre_release_version:
        type: string
        default: ''
        description: Version (only for pre-releases)

jobs:
  ios-build:
    name: ios-build (${{ matrix.asset }})
    runs-on: macos-26
    strategy:
      matrix:
        include:
          - asset: MapLibre.dynamic.xcframework.zip
            artifact: xcframework
            target: MapLibre.dynamic
            plugins: false
            swift_package: maplibre/maplibre-gl-native-distribution
          - asset: MapLibre.static.xcframework.zip
            artifact: xcframework-static
            target: MapLibre.static
            plugins: false
          # Same framework and module name, with the plugin API enabled.
          - asset: MapLibre.dynamic.plugins.xcframework.zip
            artifact: xcframework-plugins
            target: MapLibre.dynamic
            plugins: true
            swift_package: maplibre/maplibre-ios-with-plugin-api
          - asset: MapLibre.static.plugins.xcframework.zip
            artifact: xcframework-static-plugins
            target: MapLibre.static
            plugins: true
    env:
      ASSET: ${{ matrix.asset }}
      TARGET: ${{ matrix.target }}
      PLUGINS: ${{ matrix.plugins }}
      SWIFT_PACKAGE: ${{ matrix.swift_package }}
    defaults:
      run:
        working-directory: platform/ios
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build XCFramework
        run: |
          if [[ $TARGET == MapLibre.dynamic ]]; then
            flags=("--features=dead_strip,thin_lto" --objc_enable_binary_stripping --apple_generate_dsym)
          else
            # Keep debug information in the object files for the application's dSYM.
            flags=(--copt=-g --copt=-Oz --strip=never)
          fi
          bazel build --compilation_mode=opt --//:renderer=metal --//:plugins="$PLUGINS" "${flags[@]}" \
            "//platform/ios:$TARGET" --embed_label=maplibre_ios_"$(cat VERSION)"
          echo "xcframework=$(bazel info --compilation_mode=opt bazel-bin)/platform/ios/$TARGET.xcframework.zip" >> "$GITHUB_ENV"

      - name: Add license to XCFramework zip
        run: |
          cp "$xcframework" "$ASSET"
          chmod +w "$ASSET"
          zip "$ASSET" LICENSE.md  # add license to zip
          # Tells the release job which Swift package repository distributes this XCFramework.
          if [[ -n $SWIFT_PACKAGE ]]; then echo "$SWIFT_PACKAGE" > "$ASSET.swift-package"; fi
        working-directory: .

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.asset }}*

  ios-release:
    permissions:
      id-token: write         # needed for AWS
      contents: write         # allow making a release
      actions: write          # for triggering ios-release-cocoapods.yml
      issues: write           # for notify-release-on-prs.ts
    runs-on: ubuntu-latest
    needs: ios-build
    defaults:
      run:
        working-directory: platform/ios
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Get version (release)
        if: github.event.inputs.release == 'full'
        run: |
          echo version="$(head VERSION)" >> "$GITHUB_ENV"
          echo changelog_version_heading="## $(head VERSION)" >> "$GITHUB_ENV"

      - name: Get version (pre-release)
        if: github.event.inputs.release == 'pre'
        run: |
          version="${{ github.event.inputs.pre_release_version }}"
          if [[ -z "$version" ]]; then
            version="$(head VERSION)"
            version="${version%%-pre*}"-pre${{ github.sha }}
          fi
          if [[ "$version" != *"pre"* ]]; then
            echo "::error::Pre-release version must include 'pre' (Current version: $version)"
            exit 1
          fi
          echo version="$version" >> "$GITHUB_ENV"
          echo changelog_version_heading="## main" >> "$GITHUB_ENV"

      - name: Create tag if it does not exist
        working-directory: .
        run: .github/scripts/ensure-tag.sh ios-v${{ env.version }} ${{ github.sha }}

      - name: Extract changelog for version
        run: |
          awk '/^##/ { p = 0 }; p == 1 { print }; $0 == "${{ env.changelog_version_heading }}" { p = 1 };' CHANGELOG.md > changelog_for_version.md
          cat changelog_for_version.md

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.OIDC_AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ github.run_id }}

      - name: Upload changelog to S3
        run: aws s3 cp changelog_for_version.md s3://maplibre-native/changelogs/ios-${{ env.version }}.md

      - name: Release (GitHub) - Create Draft
        id: github_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ios-v${{ env.version }}
          files: |
            xcframework/MapLibre.dynamic.xcframework.zip
            xcframework-plugins/MapLibre.dynamic.plugins.xcframework.zip
            xcframework-static/MapLibre.static.xcframework.zip
            xcframework-static-plugins/MapLibre.static.plugins.xcframework.zip
          tag_name: ios-v${{ env.version }}
          prerelease: ${{ github.event.inputs.release == 'pre' || contains(env.version, '-pre') }}
          body_path: platform/ios/changelog_for_version.md
          fail_on_unmatched_files: true
          draft: true

      # needed to trigger the release workflows of the Swift package repositories
      - name: Generate token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate_token
        with:
          app-id: ${{ secrets.MAPLIBRE_NATIVE_BOT_APP_ID }}
          private-key: ${{ secrets.MAPLIBRE_NATIVE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - run: npm install
        working-directory: .

      - name: Release (CocoaPods)
        shell: bash -leo pipefail {0}  # so pod is found
        run: gh workflow run ios-release-cocoapods.yml --field version=${{ env.version }}
        env:
         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release (remove draft)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ios-v${{ env.version }}
          name: ios-v${{ env.version }}
          draft: false

      # Each repository named by swift_package in the ios-build matrix is a Swift package with
      # a release.yml workflow that points its binary target at an XCFramework of this release.
      - name: Release (Swift Package Index)
        working-directory: .
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          shopt -s failglob
          status=0
          # Release every repository even if one dispatch fails, then fail the step.
          for file in xcframework*/*.swift-package; do
            asset="$(basename "$file" .swift-package)"
            gh workflow run release.yml --repo "$(< "$file")" --ref main \
              --field version="$version" \
              --field changelog_url="https://maplibre-native.s3.eu-central-1.amazonaws.com/changelogs/ios-$version.md" \
              --field download_url="https://github.com/maplibre/maplibre-native/releases/download/ios-v$version/$asset" ||
              status=1
          done
          exit "$status"

      - name: Write release notifications
        if: github.repository_owner == 'maplibre'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/notify-release-on-prs.ts --tag ios-v${{ env.version }}
        working-directory: .
