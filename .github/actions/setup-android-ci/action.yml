name: setup-android-ci
description: "Sets up Android CI environment"
runs:
  using: "composite"
  steps:
    - name: Free Disk Space (Ubuntu)
      if: startsWith(runner.name, 'GitHub Actions')
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      with:
        tool-cache: true
        android: false
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Validate VERSION
      run: .github/scripts/validate-version.sh platform/android/VERSION
      working-directory: .
      shell: bash

    - run: echo "cmake.dir=$(dirname "$(dirname "$(command -v cmake)")")" >> local.properties
      shell: bash

    - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
      with:
        distribution: "temurin"
        java-version: "17"

    - name: restore-gradle-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.gradle
        key: gradle-v1-${{ github.job }}-${{ matrix.renderer }}-${{ hashFiles('platform/android/gradle/**', 'platform/android/**/*.gradle.kts') }}
        restore-keys: |
          gradle-v1-${{ github.job }}-${{ matrix.renderer }}-
          gradle-v1-

    # Robolectric downloads its android-all jars at test time into the local Maven repository, outside Gradle
    - name: restore-robolectric-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository/org/robolectric
        key: robolectric-v1-${{ hashFiles('platform/android/gradle/libs.versions.toml') }}
        restore-keys: robolectric-v1-

    - uses: ./.github/actions/install-sccache
