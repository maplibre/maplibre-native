name: 'get-pr-number'
description: 'Gets the PR number from an artifact'
outputs:
  pr-number:
    description: "PR number, or empty when there is none or the PR is no longer at the commit the triggering run built"
    value: ${{ steps.cat.outputs.pr-number }}
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/download-workflow-run-artifact
      with:
        artifact-name: pr-number
        files: pr_number
        optional: 'true'

    # The artifact is written by a pull_request run, which a fork controls, so
    # the number must belong to a PR whose head is the commit that run built
    - id: cat
      run: |
        touch ./pr_number
        pr_number="$(cat ./pr_number)"
        if [[ ! "$pr_number" =~ ^([1-9][0-9]*)?$ ]]; then
          echo "::error::pr-number artifact does not contain a PR number"
          exit 1
        fi
        if [ -n "$pr_number" ]; then
          pr_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq .head.sha)"
          if [ "$pr_head" != "$RUN_HEAD_SHA" ]; then
            echo "::notice::Ignoring PR #$pr_number, which is at $pr_head, not at $RUN_HEAD_SHA, the commit the triggering run built"
            pr_number=
          fi
        fi
        echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
