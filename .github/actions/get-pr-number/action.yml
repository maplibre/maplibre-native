name: 'get-pr-number'
description: 'Gets the PR number from an artifact as the pr-number output and the PR_NUMBER environment variable'
outputs:
  pr-number:
    description: "PR number or empty string"
    value: ${{ steps.cat.outputs.pr-number }}
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/download-workflow-run-artifact
      with:
        artifact-name: pr-number
        files: pr_number
        optional: 'true'

    # The artifact is written by a pull_request run, which a fork controls, so
    # the number must belong to a PR whose head is the commit that run built
    - id: cat
      run: |
        touch ./pr_number
        pr_number="$(cat ./pr_number)"
        if [[ ! "$pr_number" =~ ^([1-9][0-9]*)?$ ]]; then
          echo "::error::pr-number artifact does not contain a PR number"
          exit 1
        fi
        if [ -n "$pr_number" ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq .head.sha)" != "$RUN_HEAD_SHA" ]; then
          echo "::error::PR #$pr_number is not at $RUN_HEAD_SHA, the commit the triggering run built"
          exit 1
        fi
        echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"
        echo "PR_NUMBER=$pr_number" >> "$GITHUB_ENV"
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
