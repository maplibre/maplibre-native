name: 'Download workflow_run artifact'
description: 'Downloads an artifact from the workflow that triggered workflow_run and takes the listed files from it'
inputs:
  artifact-name:
    description: 'Name of artifact'
    required: true
  files:
    description: 'Comma-separated top-level files to take from the artifact into the workspace; everything else in it is ignored'
    required: true
  optional:
    description: 'Do not fail when the artifact or one of the files is missing'
    required: false
    default: 'false'
outputs:
  found:
    description: 'Whether every listed file was taken from the artifact'
    value: ${{ steps.extract.outputs.found }}
runs:
  using: "composite"
  steps:
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#workflow_run
    - name: Download ${{ inputs.artifact-name }} artifact
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
          });
          let matchArtifact = allArtifacts.data.artifacts.filter((artifact) => {
            return artifact.name == "${{ inputs.artifact-name }}"
          })[0];
          if (!matchArtifact) {
            console.log("Could not find artifact '${{ inputs.artifact-name }}'");
            return;
          }
          let download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: matchArtifact.id,
              archive_format: 'zip',
          });
          let fs = require('fs');
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/${{ inputs.artifact-name }}.zip`, Buffer.from(download.data));

    # The artifact was uploaded by a run that a fork PR controls, so extract
    # only the listed names into an empty directory and move regular files
    # (not symlinks) into the workspace.
    - name: Extract ${{ inputs.artifact-name }}
      id: extract
      shell: bash
      run: |
        read -ra files <<< "${FILES//,/ }"
        dir="$(mktemp -d)"
        if [ -f "$ZIP" ]; then
          unzip -q "$ZIP" "${files[@]}" -d "$dir" || true
        fi
        found=true
        for f in "${files[@]}"; do
          if [ -f "$dir/$f" ] && [ ! -L "$dir/$f" ]; then
            mv "$dir/$f" "./$f"
          elif [ "$OPTIONAL" = true ]; then
            found=false
          else
            echo "::error::artifact $ARTIFACT has no regular file $f"
            exit 1
          fi
        done
        rm -rf "$dir"
        echo "found=$found" >> "$GITHUB_OUTPUT"
      env:
        ARTIFACT: ${{ inputs.artifact-name }}
        FILES: ${{ inputs.files }}
        OPTIONAL: ${{ inputs.optional }}
        ZIP: ${{ runner.temp }}/${{ inputs.artifact-name }}.zip
