name: 'Download workflow_run artifact'
description: 'Downloads an artifact from the workflow that triggered workflow_run and takes the listed files from it'
inputs:
  artifact-name:
    description: 'Name of artifact'
    required: true
  files:
    description: 'Comma-separated top-level files to take from the artifact into the workspace; everything else in it is ignored'
    required: true
  optional:
    description: 'Do not fail when the artifact or one of the files is missing'
    required: false
    default: 'false'
outputs:
  found:
    description: 'Whether every listed file was taken from the artifact'
    value: ${{ steps.take.outputs.found }}
runs:
  using: "composite"
  steps:
    # pattern rather than name, so a missing artifact downloads nothing instead of failing
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: ${{ inputs.artifact-name }}
        merge-multiple: true
        path: ${{ runner.temp }}/${{ inputs.artifact-name }}
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    # The artifact was uploaded by a run that a fork PR controls, so only the
    # listed files leave the download directory.
    - name: Take ${{ inputs.artifact-name }} files
      id: take
      shell: bash
      run: |
        read -ra files <<< "${FILES//,/ }"
        found=true
        for f in "${files[@]}"; do
          if [ -f "$DIR/$f" ]; then
            mv "$DIR/$f" "./$f"
          elif [ "$OPTIONAL" = true ]; then
            found=false
          else
            echo "::error::artifact $ARTIFACT has no file $f"
            exit 1
          fi
        done
        echo "found=$found" >> "$GITHUB_OUTPUT"
      env:
        ARTIFACT: ${{ inputs.artifact-name }}
        FILES: ${{ inputs.files }}
        OPTIONAL: ${{ inputs.optional }}
        DIR: ${{ runner.temp }}/${{ inputs.artifact-name }}
