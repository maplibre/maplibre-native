[versions]
androidGradlePlugin = "9.3.1"
appcompat = "1.8.0"
constraintLayout = "2.2.2"
espresso = "3.7.0"
testJunit = "1.3.0"
testRules = "1.7.0"

[libraries]
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
constraintLayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintLayout" }
testJunit = { module = "androidx.test.ext:junit", version.ref = "testJunit" }
testEspressoCore = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
testRules = { module = "androidx.test:rules", version.ref = "testRules" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "androidGradlePlugin" }
